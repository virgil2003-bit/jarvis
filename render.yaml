services:
  - type: web
    name: jarvis
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && node --check server.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENAI_API_KEY
        sync: false
      - key: JARVIS_ACCESS_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: JARVIS_HOURLY_LIMIT
        value: "30"
